name: Claude Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage Issue with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(gh issue *)"'
          prompt: |
            A new GitHub issue has been opened. Your job is to triage it automatically.

            Repository: ${{ github.repository }}
            Issue number: ${{ github.event.issue.number }}
            Title: "${{ github.event.issue.title }}"

            Steps:
            1. Run `gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }}` to read the full issue body.
            2. Determine the issue type: bug report, feature request, question, documentation gap, or other.
            3. Edit the issue body with `gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "..."` to improve its structure. Rules:
               - Bug report → ensure sections exist: ## Description, ## Steps to Reproduce, ## Expected Behavior, ## Actual Behavior, ## Environment. Fill in obvious gaps from context clues in the original text.
               - Feature request → ensure sections: ## Problem Statement, ## Proposed Solution, ## Acceptance Criteria.
               - Question or other → restate the question clearly with any missing context noted.
               - Always preserve the reporter's original wording; only add missing structure and clarifying sections.
            4. Apply labels: `gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label "..."`. Choose only applicable labels from the standard set: bug, enhancement, question, documentation, good first issue, help wanted. Comma-separate multiple labels.
            5. Post a short diagnostic comment: `gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "..."`. Include: issue type identified, labels applied, any clarifying questions for the reporter, and suggested next steps.
